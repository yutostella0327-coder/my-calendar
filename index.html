<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="予定">
  <meta name="theme-color" content="#ffffff">
  <title>予定</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <button id="prev" class="nav" aria-label="前の月">◀</button>
    <h1 id="month-label"></h1>
    <button id="next" class="nav" aria-label="次の月">▶</button>
    <button id="today" class="today-btn">今日</button>
  </header>

  <div class="weekdays">
    <span class="sun">日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span class="sat">土</span>
  </div>
  <main id="grid" class="grid"></main>

  <section class="day">
    <p id="notice" class="notice" hidden>試合日程を読み込めませんでした</p>
    <h2 id="day-label"></h2>
    <ul id="day-list" class="day-list"></ul>
  </section>

  <footer class="backup">
    <button id="export">書き出し</button>
    <button id="import">読み込み</button>
    <input id="import-file" type="file" accept="application/json,.json" hidden>
  </footer>

  <button id="add" class="add" aria-label="予定を追加">＋</button>

  <dialog id="sheet" class="sheet">
    <form id="form" method="dialog">
      <h2 id="form-title">予定を追加</h2>
      <div class="types" role="radiogroup" aria-label="種類">
        <label><input type="radio" name="type" value="baito" checked><span>バイト</span></label>
        <label><input type="radio" name="type" value="jugyo"><span>授業</span></label>
        <label><input type="radio" name="type" value="shukatsu"><span>就活</span></label>
      </div>
      <label class="field">タイトル<input name="title" required placeholder="例：ABCマート"></label>
      <label class="field">日付<input name="date" type="date" required></label>
      <div class="row">
        <label class="field">開始<input name="start" type="time"></label>
        <label class="field">終了<input name="end" type="time"></label>
      </div>
      <div id="repeat-box" class="repeat" hidden>
        <label class="check"><input name="weekly" type="checkbox"> 毎週くり返す</label>
        <label class="field">終わりの日<input name="until" type="date"></label>
      </div>
      <label class="field">メモ<textarea name="memo" rows="2"></textarea></label>
      <p id="form-error" class="form-error" hidden></p>
      <div class="actions">
        <button type="button" id="delete" class="danger" hidden>消す</button>
        <button type="button" id="cancel">キャンセル</button>
        <button type="submit" id="save" class="primary">保存</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
